name: Fetch SoMAS buoy

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Keep only the newest fetch when schedules overlap or runners back up after an outage.
concurrency:
  group: fetch-somas-buoy
  cancel-in-progress: true

jobs:
  fetch:
    # Pin image: ubuntu-latest is migrating to 26 (Oct 19, 2026) and hosted
    # capacity for the floating label was unavailable during Actions outages.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch buoy snapshot
        run: python3 scripts/fetch_buoy.py

      - name: Commit buoy.json if changed
        run: |
          git add buoy.json
          if git diff --cached --quiet; then
            echo "buoy.json unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update buoy.json from SoMAS GSB Buoy #1"
          git push
